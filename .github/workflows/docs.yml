name: Deploy docs

# Publishes the mkdocs site to GitHub Pages. Requires Pages to be enabled for
# the repo with "Source: GitHub Actions" (Settings -> Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package with docs extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[docs]"

      - name: Build site
        run: python -m mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: ${{ github.event.repository.has_pages == true }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.setOutput(
                "can_deploy",
                data.build_type === "workflow" ? "true" : "false"
              );
            } catch (error) {
              if (error.status === 404) {
                core.info("Pages is not enabled for this repository; skipping deploy.");
                core.setOutput("can_deploy", "false");
                return;
              }
              throw error;
            }
      - id: deployment
        if: ${{ steps.pages.outputs.can_deploy == 'true' }}
        uses: actions/deploy-pages@v4
